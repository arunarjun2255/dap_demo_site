<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veridian Core Banking</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <meta name="description" content="Veridian Core Banking Platform - Modern lending and portfolio analytics for NBFCs." />
    <!-- DAP SDK -->
    <script src="/index.umd.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        console.log('Document ready, initializing DAP SDK...');

        if (typeof DAP !== 'undefined') {
          DAP.init({
            configUrl: '/iap-config.json',
            debug: true
          })
            .then(() => console.log('DAP SDK initialized successfully'))
            .catch(err => console.error('DAP SDK initialization failed:', err));
        } else {
          console.error('DAP SDK script not loaded correctly');
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
